baseURL = "https://shystab.github.io/"
title = 'Shystab'
theme = "reimu"
locale = 'zh-CN'
defaultContentLanguage = 'zh-CN'
[languages]
[languages.zh-CN]
label = "简体中文"
weight = 1      
[languages.zh-TW]
label = "繁體中文"
weight = 2           
[languages.en]
label = "English"
weight = 3
[languages.ja]
label = "日本語"
weight = 4
[markup.highlight]
guessSyntax = true
noClasses = false
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
